# Every entry is an unmaintained or unsound advisory, not a vulnerability, and every one
# reaches the tree through `tauri -> {muda, tao, tauri-utils}`, which only `apps/overlay`
# pulls. Listed individually rather than dropping `--deny warnings`, so the job still fails
# on a future advisory we could act on. Revisit when Tauri moves off the GTK3 bindings.
[advisories]
ignore = [
    # gtk-rs GTK3 bindings, unmaintained upstream since 2024-03-04.
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11-sys
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk-sys
    "RUSTSEC-2024-0420", # gtk3-macros
    # Unsound `Iterator`/`DoubleEndedIterator` for `glib::VariantStrIter`. The overlay
    # never constructs one, and it is unreachable from any library crate.
    "RUSTSEC-2024-0429", # glib
    # `proc-macro-error`, unmaintained. A build-time dependency of glib-macros.
    "RUSTSEC-2024-0370",
    # The `unic-*` family, unmaintained. Pulled by tauri-utils -> urlpattern.
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
]
