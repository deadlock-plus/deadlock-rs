name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every job but `msrv` runs the toolchain pinned in `rust-toolchain.toml`; bump both
# together.

jobs:
  # Windows is the platform the reader is exercised on: `process.rs` only compiles there.
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # Not a duplicate run: Linux compiles a different backend (`linux.rs`, `procmaps.rs`).
  test-linux:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      # Tauri's Linux backend links against WebKitGTK and friends, so any `--workspace`
      # job on Linux needs these; a missing one fails with an opaque pkg-config error.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo test --workspace --all-features

  # Both platforms: a Windows-only lint job leaves the entire Linux backend unlinted and
  # its rustdoc unchecked.
  lint:
    name: fmt + clippy + docs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets
      # `RUSTDOCFLAGS` is separate because `RUSTFLAGS` does not reach rustdoc: without it
      # this step reports broken intra-doc links and still passes.
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV 1.88
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo check
          -p deadlock-core -p deadlock-memory -p deadlock-reader
          -p deadlock-events -p deadlock-replay -p deadlock-walker
          -p deadlock-data
          --all-features

  # The README claims the offline paths cross-compile clean; this keeps that true.
  # `deadlock-data` and `deadlock-replay` matter most here: both pick a pure-Rust
  # decompressor precisely so no C toolchain is needed. `online` is excluded because its
  # TLS build script needs a C cross-compiler.
  cross:
    name: cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux has both a process backend and the Steam account lookup, so the examples
          # compile there and are checked.
          - target: x86_64-unknown-linux-musl
            examples: "--examples"
          # macOS has neither. The libraries still have to build; the examples cannot.
          - target: aarch64-apple-darwin
            examples: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo check --target ${{ matrix.target }}
          -p deadlock-core -p deadlock-memory -p deadlock-reader
          -p deadlock-events -p deadlock-data
          -p deadlock-replay -p deadlock-walker
          ${{ matrix.examples }}
          --features deadlock-memory/serde,deadlock-reader/serde,deadlock-reader/events,deadlock-reader/positions

  # `cargo audit` is installed rather than pulled in as a third-party action, so this job
  # adds no new action to trust. `.cargo/audit.toml` lists the ignored advisories with
  # reasons; `--deny warnings` keeps the job failing on anything new.
  audit:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  # The root licence files do not reach the packages, so each published crate keeps a
  # copy. `apps/` is excluded: those are `publish = false`.
  package:
    name: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: every package carries the licence
        shell: bash
        run: |
          set -euo pipefail
          for c in deadlock-core deadlock-memory deadlock-reader \
                   deadlock-events deadlock-data deadlock-replay deadlock-walker; do
            files=$(cargo package -p "$c" --list --allow-dirty)
            for f in LICENSE-MIT LICENSE-APACHE; do
              if ! grep -qx "$f" <<<"$files"; then
                echo "::error::$c would publish without $f"
                exit 1
              fi
            done
          done
          echo "all packages carry LICENSE-MIT and LICENSE-APACHE"
